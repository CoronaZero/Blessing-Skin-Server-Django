{% extends "base.html" %}
{% block title %}重置密码 - {{ site_name|default:"Blessing Skin" }}{% endblock %}

{% block content %}
<div style="max-width:420px;margin:40px auto">
  <div class="card">
    <div class="card-body">
      <h1 class="card-title">重置密码</h1>
      <div id="reset-alert" style="display:none" class="alert alert-danger"></div>

      <form id="reset-form" data-uid="{{ uid }}" data-token="{{ token }}">
        {% csrf_token %}
        <input type="hidden" name="uid" value="{{ uid }}">
        <input type="hidden" name="token" value="{{ token }}">
        <div class="bs-field">
          <label for="id-password">新密码（8-32 位）</label>
          <input class="form-control" id="id-password" name="password" type="password"
                 minlength="8" maxlength="32" required>
        </div>
        <div class="bs-field">
          <label for="id-password2">确认新密码</label>
          <input class="form-control" id="id-password2" name="password_confirmation"
                 type="password" minlength="8" maxlength="32" required>
        </div>
        <button class="btn btn-primary" style="width:100%" type="submit">
          重置密码
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_foot %}
<script>
(function () {
  const form = document.getElementById("reset-form");
  const alertBox = document.getElementById("reset-alert");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const fd = new FormData(form);
    if (fd.get("password") !== fd.get("password_confirmation")) {
      alertBox.textContent = "两次输入的密码不一致";
      alertBox.style.display = "block";
      return;
    }
    const payload = await window.bsPost("/auth/reset?" +
      "uid=" + encodeURIComponent(fd.get("uid")) +
      "&token=" + encodeURIComponent(fd.get("token")), fd);
    alertBox.className = "alert " +
      (payload.code === 0 ? "alert-success" : "alert-error");
    alertBox.textContent = payload.message;
    alertBox.style.display = "block";
    if (payload.code === 0) {
      setTimeout(function () { window.location.href = "/auth/login"; }, 1600);
    }
  });
})();
</script>
{% endblock %}
