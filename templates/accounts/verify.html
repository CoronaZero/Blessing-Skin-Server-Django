{% extends "base.html" %}
{% block title %}邮箱验证{% endblock %}

{% block content %}
<div style="max-width:420px;margin:48px auto;text-align:center">
  {% if ok %}
  <div class="card">
    <div class="card-body" style="padding:40px 24px">
      <div style="font-size:48px;color:var(--bs-success)">✓</div>
      <h1 style="margin:16px 0 8px;font-size:20px">邮箱验证成功</h1>
      <p style="color:var(--bs-text-secondary);font-size:14px;margin:0">
        你的邮箱已通过验证，现在可以使用站点的完整功能了。
      </p>
      <a class="btn btn-primary" href="/user" style="margin-top:20px">进入用户中心</a>
    </div>
  </div>
  {% else %}
  <div class="card">
    <div class="card-body" style="padding:40px 24px">
      <div style="font-size:48px;color:var(--bs-danger)">✗</div>
      <h1 style="margin:16px 0 8px;font-size:20px">验证链接无效或已过期</h1>
      <p style="color:var(--bs-text-secondary);font-size:14px;margin:0 0 16px">
        链接可能已使用过或超过 1 小时有效期。你可以在用户中心仪表盘点击
        「重新发送验证邮件」获取新的验证链接。
      </p>
      <a class="btn btn-outline-secondary" href="/user">返回用户中心</a>
    </div>
  </div>
  {% endif %}
</div>
{% endblock %}
