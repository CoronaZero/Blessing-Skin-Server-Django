<!doctype html>
{% load static %}
<html lang="zh-CN" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}管理面板{% endblock %} - {{ site_name_or_default }}</title>
  <script>
    /* 主题预置（防白闪）：CSS 加载前先读到偏好设置 data-bs-theme */
    (function () {
      try {
        var s = localStorage.getItem("bs-theme");
        var dark = s !== null
          ? s === "dark"
          : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (dark) { document.documentElement.setAttribute("data-bs-theme", "dark"); }
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/bootstrap-icons.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/base.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <nav class="navbar navbar-expand-lg app-navbar sticky-top border-bottom shadow-sm">
    <div class="container-fluid px-3">
      <a class="navbar-brand fw-bold" href="/admin/" style="color:var(--bs-primary)">
        <i class="bi bi-speedometer2 me-1"></i>管理面板
      </a>
      <div class="d-flex align-items-center gap-2 ms-auto">
        <button class="btn btn-link text-secondary p-1" id="theme-toggle" type="button"
                title="切换夜间/日间模式" aria-label="切换夜间/日间模式">
          <i class="bi bi-moon-stars" id="theme-icon" style="font-size:1.05rem"></i>
        </button>
        <a href="/" class="small text-secondary text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>返回站点
        </a>
        <button class="navbar-toggler d-lg-none" type="button" data-bs-toggle="offcanvas"
                data-bs-target="#pm-sidebar" aria-controls="pm-sidebar" aria-label="打开菜单">
          <span class="navbar-toggler-icon"></span>
        </button>
      </div>
    </div>
  </nav>

  <div class="container-fluid px-3 py-4">
    <div class="row">
      <aside class="col-lg-2 d-none d-lg-block">
        <div class="card side-nav p-2 sticky-top" style="top:76px">
          {% include "panel/_nav.html" %}
        </div>
      </aside>
      <main class="col-lg-10">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <!-- 竖屏手机侧栏抽屉 -->
  <div class="offcanvas offcanvas-start" tabindex="-1" id="pm-sidebar" style="max-width:260px">
    <div class="offcanvas-header">
      <h5 class="offcanvas-title">管理面板</h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="关闭"></button>
    </div>
    <div class="offcanvas-body side-nav p-2">
      {% include "panel/_nav.html" %}
    </div>
  </div>

  <script src="{% static 'vendor/bootstrap/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'js/base.js' %}"></script>
  <script src="{% static 'js/panel.js' %}"></script>
  {% block extra_foot %}{% endblock %}
</body>
</html>
