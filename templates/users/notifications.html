{% extends "base.html" %}
{% load static %}
{% block title %}站内通知 - {{ site_name|default:"Blessing Skin" }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-3">
  <h1 class="h4 mb-0">站内通知</h1>
  <div class="d-flex gap-2">
    <button class="btn btn-outline-secondary btn-sm" id="read-all-btn"
            data-url="/user/notifications/read-all" type="button">
      <i class="bi bi-check2-all me-1"></i>全部已读</button>
    <a class="btn btn-outline-secondary btn-sm" href="/user">← 返回用户中心</a>
  </div>
</div>
<div id="notifications-list" class="card">
  <div class="card-body"></div>
</div>
{% endblock %}

{% block extra_foot %}
<script src="{% static 'js/user_notifications.js' %}"></script>
{% endblock %}
