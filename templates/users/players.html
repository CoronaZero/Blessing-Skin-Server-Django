{% extends "base.html" %}
{% load static %}
{% block title %}我的角色 - {{ site_name|default:"Blessing Skin" }}{% endblock %}

{% block content %}
<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
  <h1 style="margin:0;font-size:20px">我的角色</h1>
  <a class="btn btn-outline-secondary" href="/user">← 返回用户中心</a>
</div>

<div class="card" style="margin-bottom:18px">
  <div class="card-body">
    <h2 style="font-size:15px;margin:0 0 12px">添加角色</h2>
    <form id="add-player-form" style="display:flex;gap:8px;max-width:380px">
      {% csrf_token %}
      <input class="form-control" name="name" placeholder="角色名" required>
      <button class="btn btn-primary" type="submit">添加</button>
    </form>
  </div>
</div>

<div id="players-list" class="bs-grid"></div>
{% endblock %}

{% block extra_foot %}
<script src="{% static 'js/user_players.js' %}"></script>
{% endblock %}
