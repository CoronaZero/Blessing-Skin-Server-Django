{% extends "base.html" %}
{% block title %}需要验证邮箱 - {{ site_name|default:"Blessing Skin" }}{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-6">
    <div class="card">
      <div class="card-body text-center py-4">
        <i class="bi bi-envelope-exclamation" style="font-size:2rem;color:var(--bs-warning)"></i>
        <h1 class="h5 mt-3 mb-2">需要验证邮箱</h1>
        <p class="text-secondary small mb-3">{{ reason }}</p>
        <p class="small text-secondary mb-4">
          请到注册邮箱查收验证邮件（含垃圾箱），或到
          <a href="/user/profile">资料设置</a> 页重新发送验证邮件。
        </p>
        <div class="d-flex gap-2 justify-content-center flex-wrap">
          <a class="btn btn-primary btn-sm" href="/user/profile">前往资料设置</a>
          <a class="btn btn-outline-secondary btn-sm" href="/user">返回用户中心</a>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
