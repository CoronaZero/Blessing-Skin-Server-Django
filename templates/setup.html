{% extends "base.html" %}
{% block title %}安装向导 - Blessing Skin{% endblock %}

{% block navbar %}{% endblock %}
{% block content %}
<div style="max-width:520px;margin:48px auto">
  <h1 style="text-align:center">安装 Blessing Skin</h1>
  <p style="text-align:center;color:var(--bs-text-secondary);font-size:13px">
    欢迎使用！填写以下信息完成初始化
  </p>

  <div class="bs-card" style="margin-top:20px">
    <div class="bs-card-body">
      <div id="setup-alert" style="display:none" class="bs-alert bs-alert-error"></div>

      <form id="setup-form">
        {% csrf_token %}
        <div class="bs-field">
          <label>站点名称</label>
          <input class="bs-input" name="site_name" required placeholder="我的皮肤站">
        </div>
        <div class="bs-field">
          <label>站点地址（用于邮件链接，如 https://skin.example.com）</label>
          <input class="bs-input" name="site_url" placeholder="https://skin.example.com">
        </div>
        <div class="bs-field">
          <label>管理员邮箱</label>
          <input class="bs-input" name="admin_email" type="email" required>
        </div>
        <div class="bs-field">
          <label>管理员昵称</label>
          <input class="bs-input" name="admin_nickname" placeholder="Admin">
        </div>
        <div class="bs-field">
          <label>管理员密码（至少 8 位）</label>
          <input class="bs-input" name="admin_password" type="password"
                 minlength="8" required>
        </div>
        <button class="bs-btn bs-btn-primary" style="width:100%" type="submit">
          完成安装
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_foot %}
<script>
(function () {
  const form = document.getElementById("setup-form");
  const alertBox = document.getElementById("setup-alert");

  form.addEventListener("submit", async function (e) {
    e.preventDefault();
    const fd = new FormData(form);
    const body = {};
    fd.forEach(function (v, k) { body[k] = v; });

    const resp = await fetch("/setup", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-CSRFToken": window.bsCsrfToken(),
      },
      body: JSON.stringify(body),
    });
    const payload = await resp.json();
    if (payload.code === 0) {
      window.bsToast("安装成功，即将进入管理后台…", "success");
      setTimeout(function () { window.location.href = payload.data.redirectTo; }, 1200);
      return;
    }
    alertBox.textContent = payload.message;
    alertBox.style.display = "block";
  });
})();
</script>
{% endblock %}
