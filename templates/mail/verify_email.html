{% extends "mail/base.html" %}
{% block content %}
  <h2 style="margin:0 0 12px;font-size:17px;color:#1a1a1a;">验证你的邮箱</h2>
  <p style="margin:0 0 16px;font-size:14px;color:#525252;line-height:1.7;">
    欢迎注册 {{ site_name }}！点击下方按钮完成邮箱验证。
  </p>
  <table role="presentation" cellpadding="0" cellspacing="0" width="100%"><tr><td align="center" style="padding:8px 0 20px;">
    <a href="{{ link }}"
       style="display:inline-block;background:#0052d9;color:#ffffff;text-decoration:none;
              font-size:14px;font-weight:600;padding:11px 32px;border-radius:6px;">
      验证邮箱
    </a>
  </td></tr></table>
  <p style="margin:0 0 8px;font-size:13px;color:#525252;">
    按钮无效时，复制以下链接到浏览器打开：
  </p>
  <p style="margin:0;font-size:13px;color:#0052d9;word-break:break-all;">{{ link }}</p>
  <p style="margin:16px 0 0;font-size:12px;color:#9aa5b1;">
    链接 1 小时内有效；更改邮箱后旧链接自动失效。
  </p>
{% endblock %}
{% block footer %}
  此邮件由系统发送，请勿直接回复。
{% endblock %}
